<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Remove Student</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="form-container">

        <h1>Remove Student</h1>

        <form method="POST">

            <label>Enter Student ID</label>

            <input
                type="number"
                name="id"
                placeholder="Example: 1001"
                required
            >

            <button type="submit">
                Remove Student
            </button>

        </form>

        {% if message %}

            <p class="message">
                {{ message }}
            </p>

        {% endif %}

        <a href="/" class="back-button">
            ← Back to Menu
        </a>

    </div>

</body>
</html>
